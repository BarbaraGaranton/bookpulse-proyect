<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookPulse - Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ============================================
           LOGIN / REGISTRO - Estilos específicos
        ============================================ */

        .auth-wrapper {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            background-color: var(--color-white);
            border: 1.5px solid var(--color-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .auth-deco-top {
            position: absolute;
            top: -14px;
            right: 20px;
            font-size: 24px;
            color: var(--color-primary-medium);
        }

        .auth-deco-bottom {
            position: absolute;
            bottom: -14px;
            left: 20px;
            font-size: 24px;
            color: var(--color-primary-medium);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--color-primary-dark);
            text-align: center;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--color-text-soft);
            text-align: center;
            margin-bottom: 28px;
        }

        /* Tabs para cambiar entre login y registro */
        .auth-tabs {
            display: flex;
            background-color: var(--color-primary-soft);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-soft);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

        .auth-tab.active {
            background-color: var(--color-white);
            color: var(--color-primary);
            box-shadow: 0 1px 4px rgba(123, 47, 190, 0.15);
        }

        /* Formularios */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-submit {
            width: 100%;
            background-color: var(--color-primary);
            color: var(--color-white);
            border: none;
            border-radius: 24px;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }

        .auth-submit:hover {
            background-color: var(--color-primary-dark);
        }

        .auth-switch {
            font-size: 13px;
            color: var(--color-text-soft);
            text-align: center;
            margin-top: 16px;
        }

        .auth-switch span {
            color: var(--color-primary);
            cursor: pointer;
            font-weight: 500;
        }

        .auth-switch span:hover {
            text-decoration: underline;
        }

        .auth-books {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 20px;
            color: var(--color-primary-light);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            B<em class="logo-flower">✿</em><em class="logo-flower">✿</em>kPulse
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
        </ul>
    </nav>

    <!-- AUTH WRAPPER -->
    <div class="auth-wrapper">
        <div class="auth-container">

            <!-- Decoraciones -->
            <span class="auth-deco-top">✿</span>
            <span class="auth-deco-bottom">✿</span>

            <h1 class="auth-title">Bienvenida a BookPulse</h1>
            <p class="auth-subtitle">Tu espacio emocional de lectura 💜</p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showTab('login')">Iniciar sesión</button>
                <button class="auth-tab" onclick="showTab('register')">Crear cuenta</button>
            </div>

            <!-- Alerta de error/éxito -->
            <div id="alert" class="alert"></div>

            <!-- FORMULARIO LOGIN -->
            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email</label>
                    <input
                        type="email"
                        id="login-email"
                        class="form-input"
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Contraseña</label>
                    <input
                        type="password"
                        id="login-password"
                        class="form-input"
                        placeholder="Tu contraseña"
                        maxlength = "10"
                        required
                    >
                </div>
                <button type="submit" class="auth-submit">Iniciar sesión 💜</button>
                <div class="auth-switch">
                    ¿No tenés cuenta? <span onclick="showTab('register')">Registrate acá</span>
                </div>
            </form>

            <!-- FORMULARIO REGISTRO -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="register-username">Nombre de usuario</label>
                    <input
                        type="text"
                        id="register-username"
                        class="form-input"
                        placeholder="¿Cómo te llamás?"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-email">Email</label>
                    <input
                        type="email"
                        id="register-email"
                        class="form-input"
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-password">Contraseña</label>
                    <input
                        type="password"
                        id="register-password"
                        class="form-input"
                        placeholder="Entre 6 y 10 caracteres"
                        minlength="6"
                        maxlength="10"
                        required
                    >
                </div>
                <button type="submit" class="auth-submit">Crear cuenta 💜</button>
                <div class="auth-switch">
                    ¿Ya tenés cuenta? <span onclick="showTab('login')">Iniciá sesión</span>
                </div>
            </form>

            <!-- Decoración libros -->
            <div class="auth-books">
                <span>📚</span>
                <span>✿</span>
                <span>📖</span>
            </div>

        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
